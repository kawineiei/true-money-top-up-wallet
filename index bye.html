<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Top-up – TrueMoney Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--page:#e7e3de;--sf:#fff;--tx:#1f1b18;--mu:#6d655e;--bd:#eee5dc;--or:#ff6a00;--rd:#e8312f;--yl:#ffc400;--ok:#13875a;--okb:#e3f6ec;--wn:#8a5a00;--wnb:#fff3cf;--no:#9a9189;--nob:#efebe7;color-scheme:light;--ff:"Prompt","Noto Sans Thai",system-ui,sans-serif;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--page);font-family:var(--ff);color:var(--tx);display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--or);z-index:10}
.phone{position:relative;box-sizing:content-box;width:390px;height:844px;flex:none;background:#fff;border:10px solid #101114;border-radius:56px;overflow:hidden;box-shadow:0 0 0 3px #8da2c3,0 0 0 5px #5d7396,0 18px 50px #0005;display:flex;flex-direction:column;transform-origin:center center}
@media(max-width:480px){.phone{box-sizing:border-box;width:100%;height:100%;border:0;border-radius:0;box-shadow:none;transform:none!important}.sbar,.notch{display:none}.hero{padding-top:14px!important}}
#app{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:#fff;scrollbar-width:none}#app::-webkit-scrollbar{display:none}#app.nv .bd{padding-bottom:96px}
.hd{position:sticky;top:0;z-index:5;background:var(--or);color:#fff;padding:8px 16px 12px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:16px;margin:0;flex:1;font-weight:600;color:#fff}
.hd .st{font-size:12px;font-weight:600;background:#ffffff3a;color:#fff;padding:3px 11px;border-radius:99px}
.bk{border:0;background:#ffffff33;color:#fff;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none}
.bd{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px #0000000d}
.lb{font-size:13px;color:var(--mu)}
.big{font-size:22px;font-weight:600}
.amt{display:flex;align-items:center;gap:6px;border:2px solid var(--or);border-radius:var(--r);padding:8px 14px;background:var(--bg)}
.amt span{font-size:24px;font-weight:700;color:var(--or)}
.amt input{border:0;outline:0;background:transparent;color:var(--tx);font:600 26px var(--ff);width:100%;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 14px;border-radius:99px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.btn{border:0;border-radius:99px;padding:13px;font:600 16px var(--ff);background:var(--or);color:#fff;cursor:pointer;width:100%}
.btn:disabled{background:var(--nob);color:var(--no);cursor:not-allowed}
.btn.sec{background:transparent;color:var(--or);border:1.5px solid var(--or)}
.lnk{background:none;border:0;color:var(--or);font:500 14px var(--ff);cursor:pointer;text-decoration:underline;padding:4px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yl),var(--or))}
.sub{font-size:12.5px;color:var(--mu);line-height:1.5}
.rcv{font-size:14px;color:var(--ok);background:var(--okb);padding:9px 12px;border-radius:10px;min-height:38px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sec-t{font-weight:700;font-size:14px;margin:4px 0 -4px}
.m{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:var(--r);padding:12px;background:var(--bg);cursor:pointer;position:relative}
.m.rec{border:2px solid var(--or);background:#fff4ea}
.m.off{opacity:.78;background:var(--nob);cursor:default}
.ic{width:44px;height:44px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#fff;flex:none;display:block}
.mb{flex:1;min-width:0}.mb b{font-size:14.5px}
.pr{text-align:right;flex:none}.pr small{display:block;font-size:11px;color:var(--mu)}.pr b{font-size:17px;color:var(--or)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;margin-left:4px;font-weight:700;vertical-align:middle}
.t-rec{background:var(--yl);color:#3a2a00}.t-sw{background:var(--wnb);color:var(--wn)}
.why{font-size:12.5px;color:var(--rd);margin-top:4px}
.mini{margin-top:6px;border:1px solid var(--or);background:transparent;color:var(--or);border-radius:99px;padding:3px 11px;font:500 12px var(--ff);cursor:pointer}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.row:last-child{border:0}.row span:first-child{color:var(--mu)}.row b{text-align:right}
.row.tot b{color:var(--or);font-size:18px}
.chk{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:46px;display:grid;place-items:center;margin:8px auto;animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.chk{animation:none}}
.st-s{background:var(--okb);color:var(--ok)}.st-p{background:var(--wnb);color:var(--wn)}.st-c{background:var(--nob);color:var(--no)}
.pill{font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.h{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.hx{background:#fff7f0;border-radius:10px;padding:4px 12px;margin:-4px 0 8px}
button:focus-visible,input:focus-visible,.m:focus-visible,.h:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
.sbar{height:48px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 28px 0 30px;font-size:15px;font-weight:700;background:var(--or);color:#fff}.sbar span:last-child{display:flex;gap:6px;align-items:center}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:16px;background:#000;z-index:6}
.ic svg,.ic img{width:100%;height:100%;display:block;object-fit:cover}.ic.s{width:30px;height:30px;border-radius:8px}
.ic.g{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd)}.ic.g i{display:block;overflow:hidden}
.ls{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}.mk{flex:none;background:#fff;border-radius:10px;padding:2px 6px;display:flex;align-items:center}.mk img{height:22px;width:auto;display:block}
.wm{display:flex;align-items:center}.wm img{height:46px;width:auto;display:block}
.chk{width:104px;height:104px;font-size:64px;box-shadow:0 0 0 10px var(--okb)}
.ok5{justify-content:center;text-align:center}.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.amt5{font-size:28px;font-weight:700;color:var(--or)}.via{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--mu);margin-top:4px}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.seg{display:flex;gap:3px;padding:4px;background:#fff;border:1px solid var(--bd);border-radius:99px;box-shadow:0 1px 3px #0000000d}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--mu);font:600 12.5px var(--ff);padding:9px 2px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--or);color:#fff}
/* ===== Home + shared mobile design system ===== */
.hero{background:radial-gradient(circle at 92% -8%,#ffffff22 0 20%,transparent 21%),radial-gradient(circle at 0% 55%,#ff3d0030 0 28%,transparent 29%),linear-gradient(180deg,#ff6a00,#ff5a0c);padding:8px 16px 20px;color:#fff}
.srch{display:flex;gap:8px;align-items:center}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;border-radius:99px;background:#ffffff2e;padding:0 12px}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:400 14px var(--ff)}
.sbox input::placeholder{color:#ffffffe6}
.coin{height:40px;padding:0 12px;border-radius:99px;background:#ffffff2e;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;border:0;color:#fff;font-family:var(--ff);cursor:pointer}
.bell{position:relative;width:34px;height:40px;display:grid;place-items:center;background:none;border:0;color:#fff;padding:0;cursor:pointer}
.bell b{position:absolute;top:3px;right:-2px;min-width:16px;height:16px;border-radius:99px;background:#e8312f;font-size:10px;font-weight:600;display:grid;place-items:center;border:1.5px solid #fff}
.qa{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 16px}
.qa button{background:none;border:0;color:#fff;font:500 13px var(--ff);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:0}
.qa svg{width:30px;height:30px}
.hc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{background:#fff;border-radius:22px;padding:14px;color:var(--tx);min-height:156px;display:flex;flex-direction:column;gap:6px}
.hcard .t{display:flex;align-items:center;gap:6px;font-size:14px;color:#4a4440}
.hcard .v{font-size:18px;font-weight:600}
.pb{border-radius:99px;padding:7px 18px;font:600 13.5px var(--ff);cursor:pointer;margin-top:auto;align-self:flex-start}
.pb.f{background:var(--or);color:#fff;border:0}.pb.o{background:#fff;color:var(--or);border:1.5px solid var(--or)}
.apn{font-weight:700;font-size:15px;line-height:1;color:#e8312f;letter-spacing:-.2px}.apn small{display:block;font-size:11px;color:#6d655e;font-weight:600;margin-top:1px}
.gb{background:#d6f5de;color:#244a33;border-radius:10px;padding:6px 8px;font-size:11.5px;line-height:1.35}
.sv{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;padding:20px 10px 6px}
.sv button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font:400 12px/1.35 var(--ff);color:#4a4440;cursor:pointer;padding:0}
.si{position:relative;width:52px;height:52px;display:grid;place-items:center;margin-top:6px}.si svg{width:46px;height:46px}
.bdg{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#0a9aa6;color:#fff;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:99px;white-space:nowrap;z-index:1}
.sv span.l{min-height:32px}
.ck{margin:12px 16px 0;border-radius:20px;background:#fde3d8;overflow:hidden;border:1px solid #f8d2c2}
.ckh{display:flex;align-items:center;gap:12px;padding:12px 14px}
.ckh b{font-size:16px;display:block;font-weight:600}.ckh small{font-size:13px;color:#4a4440}
.ckb{margin-left:auto;background:var(--or);color:#fff;border:0;border-radius:99px;padding:9px 20px;font:600 14px var(--ff);box-shadow:0 3px 0 #c9570a;cursor:pointer}
.ckb:disabled{background:#cfc5bd;box-shadow:0 3px 0 #b5aaa1;cursor:default}
.rw{background:#fff;margin:0 4px 4px;border-radius:16px;display:flex;gap:4px;overflow-x:auto;padding:10px 8px 8px;scrollbar-width:none}.rw::-webkit-scrollbar{display:none}
.rw .it{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.rw svg{width:38px;height:38px}.rw b{font-size:11px;font-weight:600;white-space:nowrap}.rw small{font-size:10.5px;color:var(--mu)}
.rw .dc{position:absolute;top:-2px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff;font:700 9px/14px var(--ff);text-align:center;font-style:normal}
#nav{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;pointer-events:none}
.nb{height:62px;background:#fff;border-radius:99px;box-shadow:0 4px 18px #0002;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;padding:0 6px;pointer-events:auto}
.nb button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11px var(--ff);color:#2d2926;cursor:pointer;height:50px;border-radius:99px}
.nb button svg{width:22px;height:22px}
.nb button.on{background:#f1ede9;color:var(--or)}
.nb .sc{width:58px;height:58px;border-radius:50%;background:var(--or);color:#fff;margin:-20px auto 0;box-shadow:0 4px 12px #ff6a0066;justify-self:center;padding:0}
.nb .sc svg{width:28px;height:28px}
.lr{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:500 14px var(--ff);color:var(--tx);width:100%;text-align:left}
.lr i{width:36px;height:36px;border-radius:50%;background:#fff1e6;display:grid;place-items:center;font-style:normal;font-size:17px;flex:none}
.lr span{flex:1}.lr em{color:var(--no);font-style:normal;font-size:18px}
.av{width:52px;height:52px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font:600 20px var(--ff);flex:none}
.stub{align-items:center;justify-content:center;text-align:center;gap:10px}
.stub .ico{width:72px;height:72px;border-radius:50%;background:#fff1e6;display:grid;place-items:center;font-size:32px}


/* ===== Refinements: bank separation, clean amount field, merchant + PIN flow ===== */
.amt.clean{border:0;border-bottom:1.5px solid #eadfd5;border-radius:0;padding:7px 2px;background:transparent;box-shadow:none}
.amt.clean:focus-within{border-bottom:2px solid var(--or)}
.amt.clean input{font-size:30px}
.quick-amounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick-amounts .chip{padding:9px 6px;font-size:13px}
.m{align-items:center;transition:transform .16s ease,box-shadow .16s ease}
.m:active{transform:scale(.985)}
.m .ic{width:46px;height:46px;border-radius:13px;box-shadow:0 2px 7px #0000000b}
.m .mb b{font-size:14px}
.m .pr b{font-size:15px}
.bank-note{display:flex;align-items:center;gap:7px;color:#766b62;font-size:11.5px;margin-top:4px}
.flow-card{border:1px solid #f0e5dc;border-radius:20px;background:linear-gradient(180deg,#fff,#fffaf6);padding:16px;box-shadow:0 5px 18px #6b3b1710}
.barcode-wrap{background:#fff;border:1px dashed #e9d5c5;border-radius:16px;padding:14px 10px;text-align:center;margin:14px 0}
.barcode-wrap svg{width:100%;max-width:280px;height:88px;display:block;margin:0 auto}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:20px 0 22px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid #d9c9bc;background:#fff}
.pin-dot.filled{background:var(--or);border-color:var(--or);box-shadow:0 0 0 4px #ff6a0018}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;width:100%}
.keypad button{height:48px;border:1px solid #f0e7df;border-radius:14px;background:#fff;color:#2b2520;font:600 20px var(--ff);box-shadow:0 2px 5px #00000008;cursor:pointer}
.keypad button:active{background:#fff0e5;border-color:#ffb37d}
.keypad .utility{font-size:13px;color:#766b62;background:#faf7f4}
.pin-error{min-height:20px;text-align:center;color:var(--rd);font-size:12px;margin:8px 0}
.qr-badge{display:inline-flex;align-items:center;gap:6px;background:#fff2e8;color:#b94d00;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:600}
@media(max-width:380px){.bd{padding:14px}.quick-amounts{gap:6px}.chip{padding-left:10px;padding-right:10px}.pin-dots{gap:9px}}

/* ===== Visual polish pass: clearer hierarchy, spacing and legibility ===== */
:root{
  --tx:#26211e; --mu:#716861; --bd:#eee7e1; --or:#ff6a00;
  --sf:#ffffff; --page:#e9e5e1; --r:17px;
}
/* Keep the original 390 × 844 phone canvas and existing Home layout. */
.hd{
  background:linear-gradient(115deg,#ff6a00 0%,#ff790d 100%);
  padding:11px 16px 13px; gap:11px;
  box-shadow:0 3px 12px #8b3b1518;
}
.hd h1{font-size:16px;line-height:1.35;letter-spacing:0;font-weight:600}
.bk{width:34px;height:34px;font-size:24px;background:#ffffff2e}
.bd{padding:16px;gap:13px;background:#fff}
.card{
  border:1px solid #eee7e1;border-radius:17px;padding:15px;
  box-shadow:0 3px 12px #4b2b1609;
}
.lb{font-size:12.5px;line-height:1.55;color:#716861;font-weight:500}
.big{font-size:22px;line-height:1.35;letter-spacing:-.25px}
.sub{font-size:12px;line-height:1.55;color:#746b64}
.sec-t{font-size:13px;line-height:1.45;color:#37302b;margin:2px 1px -3px;font-weight:700}
.amt.clean{min-height:49px;border-bottom:1.5px solid #e9ded5;padding:5px 2px 8px;gap:8px}
.amt.clean span{font-size:23px;color:#ff6a00}
.amt.clean input{font-size:29px;font-weight:600;line-height:1.25}
.quick-amounts{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick-amounts .chip{
  min-height:40px;padding:8px 5px;border:1px solid #eee4dc;border-radius:12px;
  background:#fffaf6;color:#443a33;font-size:13px;font-weight:600;
  box-shadow:0 1px 3px #00000008;
}
.quick-amounts .chip.on,.quick-amounts .chip:focus-visible{
  background:#fff0e5;border:1.5px solid #ff6a00;color:#d95000;
}
.chip.on{background:#ff6a00;border-color:#ff6a00;color:#fff}
.rcv{font-size:12.5px;line-height:1.55;padding:10px 12px;border-radius:12px;background:#eaf8f0;color:#18734e}
.btn{
  min-height:47px;padding:12px 16px;border-radius:14px;
  font-size:14px;font-weight:600;letter-spacing:0;
  box-shadow:0 3px 8px #ff6a001c;
}
.btn.sec{box-shadow:none;border-width:1.3px;background:#fff8f3}
.lnk{font-size:12.5px;text-decoration:none}
.seg{gap:4px;padding:4px;border-radius:13px;background:#f7f3ef;border:1px solid #eee7e1;box-shadow:none}
.seg button{min-height:35px;padding:7px 5px;font-size:11.5px;border-radius:10px}
.seg button.on{background:#ff6a00;box-shadow:0 2px 5px #ff6a0030}
/* Channel cards: stronger spacing and legible Thai bank names. */
.m{
  align-items:center;gap:11px;padding:12px 11px;min-height:75px;
  border:1px solid #eee7e1;border-radius:16px;background:#fff;
  box-shadow:0 2px 8px #34201508;
}
.m.rec{border:1.5px solid #ff8b3d;background:#fff8f2;box-shadow:0 3px 10px #ff6a0010}
.m.off{background:#faf8f6;opacity:.82;box-shadow:none}
.m .ic{width:44px;height:44px;min-width:44px;border-radius:12px;padding:3px;background:#fff;border:1px solid #f0eae5;box-shadow:none}
.m .ic svg,.m .ic img{object-fit:contain}
.m .mb{flex:1;min-width:0;overflow-wrap:anywhere}
.m .mb b{font-size:12.5px;line-height:1.45;font-weight:600;color:#302923;display:inline}
.m .sub{font-size:11px;line-height:1.5;margin-top:4px}
.m .pr{min-width:66px;max-width:82px;white-space:normal}
.m .pr small{font-size:10px;line-height:1.35;color:#82786f}
.m .pr b{font-size:13px;line-height:1.4;color:#e85f00;white-space:nowrap}
.tag{font-size:9.5px;padding:2px 6px;margin-left:3px;line-height:1.35}
.why{font-size:11px;line-height:1.45;margin-top:5px}
.mini{font-size:10.5px;padding:5px 9px;margin-top:6px}
.ls{gap:4px;margin:5px 0 1px}
.ls .ic{width:25px;height:25px;min-width:25px;padding:2px;border-radius:7px}
/* Detail and confirmation pages */
.row{gap:10px;padding:10px 0;font-size:12.5px;line-height:1.45;border-bottom:1px solid #f0ebe6}
.row span:first-child{flex:0 0 42%;color:#776e67}
.row b{flex:1;min-width:0;font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.row.tot{padding-top:12px;margin-top:2px}
.row.tot b{font-size:16px;color:#ed6500}
.bd > .card ul{padding-left:18px;line-height:1.65}
.bd > .card li{padding-left:2px;margin:3px 0}
/* Merchant barcode */
