<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Top-up – TrueMoney Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--page:#e7e3de;--sf:#fff8f1;--tx:#1f1b18;--mu:#6d655e;--bd:#eee5dc;--or:#ff6a13;--rd:#e8312f;--yl:#ffc400;--ok:#13875a;--okb:#e3f6ec;--wn:#8a5a00;--wnb:#fff3cf;--no:#9a9189;--nob:#efebe7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--page);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;color:var(--tx);display:flex;align-items:center;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:10}
.phone{position:relative;width:auto;aspect-ratio:9/19.5;height:min(100%,844px);max-width:100%;background:#fff;border:10px solid #101114;border-radius:56px;overflow:hidden;box-shadow:0 0 0 3px #8da2c3,0 0 0 5px #5d7396,0 18px 50px #0005;display:flex;flex-direction:column}
@media(max-width:480px){.phone{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}.sbar,.notch{display:none}}
#app{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:radial-gradient(ellipse 70% 28% at 100% 100%,#ffc40066,transparent 70%),radial-gradient(ellipse 65% 30% at 0% 100%,#e8312f40,transparent 70%),radial-gradient(ellipse 60% 22% at 100% 62%,#ff6a1326,transparent 70%),radial-gradient(ellipse 55% 20% at 0% 42%,#ffc40030,transparent 70%),#fff}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(100deg,#ff8a2a 0%,#f0592f 55%,#e03a3a 100%);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px #e8312f33}
.hd h1{font-size:17px;margin:0;flex:1;font-weight:700;color:#fff}
.hd .st{font-size:12px;font-weight:700;background:#ffffff3a;color:#fff;padding:3px 11px;border-radius:99px}
.bk{border:0;background:#ffffff33;color:#fff;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none}
.bd{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.lb{font-size:13px;color:var(--mu)}
.big{font-size:26px;font-weight:700}
.amt{display:flex;align-items:center;gap:6px;border:2px solid var(--or);border-radius:14px;padding:8px 14px;background:var(--bg)}
.amt span{font-size:30px;font-weight:700;color:var(--or)}
.amt input{border:0;outline:0;background:transparent;color:var(--tx);font:700 34px "Noto Sans Thai",sans-serif;width:100%;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 14px;border-radius:99px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.btn{border:0;border-radius:14px;padding:14px;font:700 16px "Noto Sans Thai",sans-serif;background:linear-gradient(120deg,var(--or),var(--rd));color:#fff;cursor:pointer;width:100%}
.btn:disabled{background:var(--nob);color:var(--no);cursor:not-allowed}
.btn.sec{background:transparent;color:var(--or);border:1.5px solid var(--or)}
.lnk{background:none;border:0;color:var(--or);font:500 14px "Noto Sans Thai",sans-serif;cursor:pointer;text-decoration:underline;padding:4px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yl),var(--or))}
.sub{font-size:12.5px;color:var(--mu);line-height:1.5}
.rcv{font-size:14px;color:var(--ok);background:var(--okb);padding:9px 12px;border-radius:10px;min-height:38px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sec-t{font-weight:700;font-size:14px;margin:4px 0 -4px}
.m{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--bg);cursor:pointer;position:relative}
.m.rec{border:2px solid var(--or);background:var(--sf)}
.m.off{opacity:.78;background:var(--nob);cursor:default}
.ic{width:44px;height:44px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#fff;flex:none;display:block}
.mb{flex:1;min-width:0}.mb b{font-size:14.5px}
.pr{text-align:right;flex:none}.pr small{display:block;font-size:11px;color:var(--mu)}.pr b{font-size:17px;color:var(--or)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;margin-left:4px;font-weight:700;vertical-align:middle}
.t-rec{background:var(--yl);color:#3a2a00}.t-sw{background:var(--wnb);color:var(--wn)}
.why{font-size:12.5px;color:var(--rd);margin-top:4px}
.mini{margin-top:6px;border:1px solid var(--or);background:transparent;color:var(--or);border-radius:99px;padding:3px 11px;font:500 12px "Noto Sans Thai",sans-serif;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.row:last-child{border:0}.row span:first-child{color:var(--mu)}.row b{text-align:right}
.row.tot b{color:var(--or);font-size:18px}
.chk{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:46px;display:grid;place-items:center;margin:8px auto;animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.chk{animation:none}}
.st-s{background:var(--okb);color:var(--ok)}.st-p{background:var(--wnb);color:var(--wn)}.st-c{background:var(--nob);color:var(--no)}
.pill{font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.h{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.hx{background:var(--sf);border-radius:10px;padding:4px 12px;margin:-4px 0 8px}
button:focus-visible,input:focus-visible,.m:focus-visible,.h:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
.sbar{height:48px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 28px 0 30px;font-size:15px;font-weight:700;background:#fff;color:#000}.sbar span:last-child{display:flex;gap:6px;align-items:center}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:16px;background:#000;z-index:6}
.ic svg,.ic img{width:100%;height:100%;display:block;object-fit:cover}.ic.s{width:30px;height:30px;border-radius:8px}
.ic.g{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd)}.ic.g i{display:block;overflow:hidden}
.ls{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}.mk{flex:none;background:#fff;border-radius:10px;padding:3px 6px;display:flex;align-items:center}.mk img{height:24px;width:auto;display:block}
.wm{display:flex;align-items:center}.wm img{height:46px;width:auto;display:block}
.chk{width:104px;height:104px;font-size:64px;box-shadow:0 0 0 10px var(--okb)}
.ok5{justify-content:center;text-align:center}.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.amt5{font-size:34px;font-weight:700;color:var(--or)}.via{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--mu);margin-top:4px}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.seg{display:flex;gap:3px;padding:4px;background:#fff;border:1px solid #ffd9b8;border-radius:18px;box-shadow:0 3px 12px #ff6a131f}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--mu);font:600 12.5px "Noto Sans Thai",sans-serif;padding:9px 2px;border-radius:14px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(110deg,#ffb300,#ff6a13 55%,#e8312f);color:#fff;box-shadow:0 3px 8px #e8312f55}
</style>
</head>

const feeT=(c,a)=>c.ft||(c.f==='q'?(S.used>=15?'฿6 (เกินโควตาฟรี)':'ฟรี (โควตาเหลือ '+(15-S.used)+' ครั้ง)'):c.f==='k'?fmt(fee(c,a))+' (ตามยอด)':c.f==='p'?fmt(fee(c,a))+' (25%)':c.f?fmt(c.f):'ฟรี');
function ev(c,a){const r={c,fee:fee(c,a)};r.total=a+r.fee;r.ok=true;
 if(a<c.min){r.ok=false;r.why='ขั้นต่ำ '+fmt(c.min)+' · ต้องเติมเพิ่มอีก '+fmt(c.min-a);r.fix=c.min}
 else if(c.max&&a>c.max){r.ok=false;r.why='เกินวงเงิน '+fmt(c.max)+' ต่อครั้ง';r.fix=c.max}
 return r}
const key=r=>r.fee*1000+(r.c.sw?100:0)+C.indexOf(r.c)/100;
const dt=t=>new Date(t).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const stT={s:'สำเร็จ',p:'รอดำเนินการ',c:'ยกเลิก'};
function hd(t,back,n){return '<div class="hd">'+(back?'<button class="bk" aria-label="ย้อนกลับ" onclick="go('+back+')">‹</button>':'')+'<span class="mk">'+TM+'</span><h1>'+t+'</h1>'+(n?'<span class="st">'+n+'/4</span>':'')+'</div>'}
function go(n){S.sc=n;render()}
function render(){stopBoom();const f=[0,s1,s2,s3,s4,s5,s6][S.sc];$('#app').innerHTML=f();$('#app').scrollTop=0;if(S.sc==1)up1();if(S.sc==2)list();if(S.sc==5)boom()}
function setAmt(v,from){S.amt=Math.min(30000,parseInt(String(v).replace(/\D/g,''))||0);const e=$(from==2?'#a2':'#a1');if(e&&e.value!=(S.amt||''))e.value=S.amt||'';from==2?list():up1()}
function up1(){const a=S.amt;$('#rc').innerHTML=a?'คุณจะได้รับเข้ากระเป๋า TrueMoney <b>'+fmt(a)+'</b> ตามจำนวนที่ต้องการ':'กรอกจำนวนเงินที่ต้องการใช้จริง ระบบจะเทียบช่องทางให้';$('#b1').disabled=!a;document.querySelectorAll('.chip').forEach(e=>e.classList.toggle('on',+e.dataset.v===a))}
function s1(){return hd('เติมเงินเข้า TrueMoney',0,1)+'<div class="bd"><div class="card">'+WM+'<div class="lb" style="margin-top:8px">ยอดคงเหลือ</div><div class="big">'+fmt(S.bal)+'</div></div>'+
'<div><div class="lb" style="margin-bottom:6px">จำนวนเงินที่ต้องการเติม</div><div class="amt"><span>฿</span><input id="a1" inputmode="numeric" placeholder="0" value="'+(S.amt||'')+'" oninput="setAmt(this.value,1)" aria-label="จำนวนเงิน"></div></div>'+
'<div class="chips">'+[20,50,100,500].map(v=>'<button class="chip" data-v="'+v+'" onclick="setAmt('+v+',1)">'+fmt(v)+'</button>').join('')+'</div><div class="rcv" id="rc"></div>'+
'<div class="card"><b>เติมฟรี 15 ครั้งต่อเดือน</b><div class="bar"><i style="width:'+Math.min(100,S.used/15*100)+'%"></i></div><div class="sub">ใช้ไปแล้ว '+S.used+' ครั้ง ตั้งแต่ครั้งที่ 16 คิด ฿6 ต่อรายการ ตู้ทรูมันนี่ที่ทรูช็อปและ MRT ฟรีไม่จำกัดครั้ง</div></div>'+
strip()+'<div style="flex:1"></div><button class="btn" id="b1" onclick="go(2)">ดูช่องทางเติมเงิน</button><button class="lnk" onclick="go(6)">ดูประวัติการเติมเงิน</button></div>'}
function s2(){const T=[['all','ทั้งหมด'],['bank','ธนาคาร'],['store','ร้านค้า'],['kiosk','ตู้เติมเงิน'],['other','อื่นๆ']];
return hd('เลือกช่องทางเติมเงิน',1,2)+'<div class="bd"><div class="card"><div class="lb">จำนวนที่ต้องการเติม (แก้ไขได้ รายการอัปเดตทันที)</div><div class="amt" style="margin-top:6px"><span style="font-size:22px">฿</span><input id="a2" inputmode="numeric" style="font-size:26px" value="'+(S.amt||'')+'" oninput="setAmt(this.value,2)" aria-label="จำนวนเงิน"></div></div>'+
'<div class="seg">'+T.map(t=>'<button class="'+(S.cat==t[0]?'on':'')+'" onclick="S.cat=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div><div id="list" style="display:flex;flex-direction:column;gap:10px"></div><div class="sub">ข้อมูลตัวอย่างเพื่อการออกแบบ ไม่ใช่เงื่อนไขจริง</div></div>'}
function card(r,rec){const c=r.c;return '<div class="m '+(rec?'rec ':'')+(r.ok?'':'off')+'" tabindex="0" onclick="pick(\''+c.id+'\')">'+lg(c.id)+'<div class="mb"><b>'+c.n+'</b>'+(rec?'<span class="tag t-rec">แนะนำ</span>':'')+(c.sw?'<span class="tag t-sw">สลับแอป</span>':'')+
ls(c)+'<div class="sub">ขั้นต่ำ '+c.mt+'<br>ค่าธรรมเนียม '+feeT(c,S.amt)+'</div>'+(r.ok?'':'<div class="why">'+r.why+'</div>'+(r.fix&&S.amt<c.min?'<button class="mini" onclick="event.stopPropagation();setAmt('+r.fix+',2)">ปรับยอดเป็น '+fmt(r.fix)+'</button>':''))+'</div>'+
(r.ok?'<div class="pr"><small>ยอดชำระจริง</small><b>'+fmt(r.total)+'</b></div>':'')+'</div>'}
function list(){const a=S.amt,el=$('#list');if(!a){el.innerHTML='<div class="card sub">กรอกจำนวนเงินด้านบนเพื่อดูช่องทางที่เติมได้</div>';return}
const all=C.filter(c=>S.cat=='all'||c.c==S.cat).map(c=>ev(c,a)),ok=all.filter(r=>r.ok).sort((x,y)=>key(x)-key(y)),no=all.filter(r=>!r.ok).sort((x,y)=>x.c.min-y.c.min);
const best=C.map(c=>ev(c,a)).filter(r=>r.ok).sort((x,y)=>key(x)-key(y))[0];
el.innerHTML=(ok.length?'<div class="sec-t">เติมได้ด้วยยอดนี้ ('+ok.length+')</div>'+ok.map(r=>card(r,best&&r.c===best.c)).join(''):'<div class="card sub">ไม่มีช่องทางในหมวดนี้ที่เติมได้ด้วยยอดนี้</div>')+(no.length?'<div class="sec-t">ยังเติมไม่ได้ด้วยยอดนี้ ('+no.length+')</div>'+no.map(r=>card(r,0)).join(''):'')}
function pick(id){S.sel=id;go(3)}
const cur=()=>{const c=C.find(x=>x.id==S.sel);return ev(c,S.amt)};
function s3(){const r=cur(),c=r.c;return hd('รายละเอียดช่องทาง',2,3)+'<div class="bd"><div class="card" style="display:flex;gap:12px;align-items:center">'+lg(c.id)+'<div style="flex:1"><b>'+c.n+'</b>'+ls(c)+'</div><span class="pill '+(r.ok?'st-s':'st-c')+'">'+(r.ok?'เติมได้':'เติมไม่ได้')+'</span></div>'+
(r.ok?'':'<div class="rcv" style="color:var(--rd);background:var(--nob)">'+r.why+'</div>')+
'<div class="card"><div class="row"><span>ยอดเติมขั้นต่ำ</span><b>'+c.mt+'</b></div><div class="row"><span>ยอดเติมสูงสุดต่อครั้ง</span><b>'+(c.max?fmt(c.max):'ไม่ระบุ')+'</b></div><div class="row"><span>จำนวนที่ต้องการเติม</span><b>'+fmt(S.amt)+'</b></div><div class="row"><span>ค่าธรรมเนียม</span><b>'+feeT(c,S.amt)+'</b></div><div class="row tot"><span>ยอดชำระจริง</span><b>'+fmt(r.total)+'</b></div></div>'+
'<div class="card"><b style="font-size:14px">เงื่อนไขของช่องทางนี้</b><ul class="sub" style="margin:6px 0 0;padding-left:18px">'+c.cond.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div style="flex:1"></div><button class="btn" '+(r.ok?'':'disabled')+' onclick="go(4)">เลือกช่องทางนี้</button><button class="btn sec" onclick="go(2)">เปลี่ยนช่องทาง</button></div>'}
function s4(){const r=cur(),c=r.c;return hd('ตรวจสอบและยืนยัน',3,4)+'<div class="bd"><div class="card"><div class="row"><span>ช่องทาง</span><b style="display:flex;align-items:center;gap:8px;justify-content:flex-end">'+lg(c.id,1)+c.n+'</b></div><div class="row"><span>จำนวนเงินที่เติม</span><b>'+fmt(S.amt)+'</b></div><div class="row"><span>ค่าธรรมเนียม</span><b>'+(r.fee?fmt(r.fee):'ฟรี')+'</b></div><div class="row tot"><span>ยอดชำระทั้งหมด</span><b>'+fmt(r.total)+'</b></div></div>'+
'<div class="rcv">คุณจะได้รับ <b>'+fmt(S.amt)+'</b> เข้ากระเป๋า TrueMoney ตามจำนวนที่ต้องการ ไม่เกินยอดที่ใช้จริง</div>'+(c.sw?'<div class="sub card">ขั้นตอนจำลอง: ระบบจะพาไปยืนยันที่แอปธนาคารแล้วกลับมาที่ TrueMoney อัตโนมัติ</div>':'')+
'<div style="flex:1"></div><button class="btn" onclick="done()">ยืนยันการเติมเงิน</button><button class="btn sec" onclick="go(2)">ยกเลิก</button></div>'}
function done(){const r=cur(),c=r.c;if(c.f==='q'||c.f==='k')S.used++;S.bal+=S.amt;const h={id:Date.now(),n:c.n,i:c.i,amt:S.amt,fee:r.fee,st:'s',t:Date.now(),ref:'TM'+String(Date.now()).slice(-9)};S.hist.unshift(h);S.last=h;go(5)}
function s5(){const h=S.last,c=C.find(x=>x.n==h.n);return '<div class="bd ok5"><div class="pop"><div class="chk">✓</div><div class="big" style="color:var(--ok);margin-top:10px">เติมเงินสำเร็จ!</div><div class="amt5">+'+fmt(h.amt)+'</div><div class="via">'+lg(c.id,1)+'<span>ผ่าน '+h.n+'</span></div></div><div class="card" style="text-align:left"><div class="row"><span>จำนวนเงินที่เติม</span><b>'+fmt(h.amt)+'</b></div><div class="row"><span>ช่องทาง</span><b>'+h.n+'</b></div><div class="row"><span>วันและเวลา</span><b>'+dt(h.t)+'</b></div><div class="row"><span>เลขที่อ้างอิง</span><b>'+h.ref+'</b></div><div class="row"><span>ยอดคงเหลือใหม่</span><b>'+fmt(S.bal)+'</b></div></div><button class="btn" id="f1" disabled onclick="S.amt=0;S.sel=null;go(1)">เสร็จสิ้น</button><button class="btn sec" id="f2" disabled onclick="go(6)">ดูประวัติการเติมเงิน</button></div>'}
function s6(){const F=[['all','ทั้งหมด'],['s','สำเร็จ'],['p','รอดำเนินการ'],['c','ยกเลิก']];
const L=S.hist.filter(h=>S.flt=='all'||h.st==S.flt).sort((a,b)=>b.t-a.t);
return hd('ประวัติการเติมเงิน',1)+'<div class="bd"><div class="tabs">'+F.map(f=>'<button class="chip '+(S.flt==f[0]?'on':'')+'" onclick="S.flt=\''+f[0]+'\';render()">'+f[1]+'</button>').join('')+'</div><div>'+
(L.length?L.map(h=>'<div class="h" tabindex="0" onclick="S.open=S.open==='+h.id+'?null:'+h.id+';render()">'+lgN(h.n)+'<div style="flex:1;min-width:0"><b style="font-size:14px">'+h.n+'</b><div class="sub">'+dt(h.t)+'</div></div><div style="text-align:right"><b>+'+fmt(h.amt)+'</b><div><span class="pill st-'+h.st+'">'+stT[h.st]+'</span></div></div></div>'+(S.open==h.id?'<div class="hx"><div class="row"><span>เลขที่อ้างอิง</span><b>'+h.ref+'</b></div><div class="row"><span>ค่าธรรมเนียม</span><b>'+(h.fee?fmt(h.fee):'ฟรี')+'</b></div><div class="row"><span>ยอดชำระทั้งหมด</span><b>'+fmt(h.amt+h.fee)+'</b></div></div>':'')).join(''):'<div class="card sub">ยังไม่มีรายการในสถานะนี้ ลองเลือกตัวกรองอื่น</div>')+'</div><div style="flex:1"></div><button class="btn" onclick="S.amt=0;go(1)">เติมเงินอีกครั้ง</button></div>'}
render();
</script>
